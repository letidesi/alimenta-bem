<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      minimum-scale=1 evita que o Android antigo faça zoom automático ao focar em inputs,
      o que causava o formulário "sumir" da tela em celulares com viewport pequeno.
      interactive-widget=resizes-content ajuda browsers Android a não cobrir o form com o teclado.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f3553" />
    <meta name="description" content="AlimentaBem — plataforma de doações" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AlimentaBem</title>
  </head>
  <body>
    <noscript>Habilite o JavaScript no seu navegador para usar o AlimentaBem.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
